<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEMA Articles</title><style>
:root{--ink:#17211e;--muted:#5c6863;--paper:#f9f7f1;--line:#d9ddd6;--accent:#176b53}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:Georgia,serif}main{max-width:860px;margin:auto;padding:72px 24px}header{max-width:620px;margin-bottom:42px}.eyebrow,.meta{font:700 .73rem/1.3 system-ui,sans-serif;letter-spacing:.12em;color:var(--accent)}h1{font-size:clamp(2.8rem,8vw,5rem);margin:.15em 0;letter-spacing:-.055em}.intro{color:var(--muted);font-size:1.2rem;line-height:1.55}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}button{cursor:pointer;border:1px solid var(--line);border-radius:99px;padding:8px 13px;background:transparent;color:var(--ink)}button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}article{padding:27px 0;border-top:1px solid var(--line)}.thumb{display:block;width:180px;aspect-ratio:16/9;object-fit:cover;margin:0 0 16px;border-radius:3px;background:#e7e9e3}h2{font-size:1.7rem;margin:7px 0;letter-spacing:-.025em}a{color:inherit;text-underline-offset:3px}.summary{color:var(--muted);line-height:1.5;margin:0 0 14px}.read{color:var(--accent);font:600 .9rem system-ui,sans-serif;text-decoration:none}.read:hover{text-decoration:underline}
</style></head><body><main><header><p class="eyebrow">SEMA WRITING</p><h1>Articles</h1><p class="intro">One place to find SEMA articles, newsletters, and plans.</p></header><nav id="filters"></nav><section id="articles"></section></main><script>
const articles=[
{title:'September 2026 Article',url:'https://sema-coms.github.io/September-2026-article/',summary:'September 2026 article.',date:'2026-09-01',category:'Articles'},
{title:'June 2026: Ebola Article',url:'https://sema-coms.github.io/June-article-2026/',summary:'June article on Ebola.',date:'2026-06-01',category:'Articles'},
{title:'Strategic Plan 2026–2029',url:'https://sema-coms.github.io/Strategic-Plan-2026-2029/',summary:'SEMA strategic plan for 2026–2029.',date:'2026-04-01',category:'Plans'},
{title:'March 2026 Article',url:'https://sema-coms.github.io/March2026/',summary:'March 2026 article.',date:'2026-03-01',category:'Articles'},
{title:'February Newsletter',url:'https://sema-coms.github.io/February/',summary:'February newsletter.',date:'2026-02-01',category:'Newsletters'},
{title:'February Newsletter (archive)',url:'https://sema-coms.github.io/Feb-Article/',summary:'An earlier February newsletter repository.',date:'2026-02-01',category:'Newsletters'},
{title:'January 2026 Article',url:'https://sema-coms.github.io/Jan-2026-article/',summary:'January 2026 article.',date:'2026-01-01',category:'Articles'}];
let active='All';const out=document.querySelector('#articles'),nav=document.querySelector('#filters');const date=d=>new Intl.DateTimeFormat(undefined,{year:'numeric',month:'long',day:'numeric'}).format(new Date(d+'T00:00:00'));
function text(tag,value,className){const el=document.createElement(tag);el.textContent=value;if(className)el.className=className;return el}
function draw(){out.innerHTML='';for(const a of articles.filter(a=>active==='All'||a.category===active).sort((a,b)=>b.date.localeCompare(a.date))){const card=document.createElement('article');if(a.thumbnail){const image=document.createElement('img');image.className='thumb';image.src=a.thumbnail;image.alt='';image.loading='lazy';card.append(image)}card.append(text('p',date(a.date)+' · '+a.category,'meta'));const heading=document.createElement('h2'),title=document.createElement('a');title.href=a.url;title.textContent=a.title;heading.append(title);card.append(heading,text('p',a.summary,'summary'));const link=document.createElement('a');link.className='read';link.href=a.url;link.textContent='Read article →';card.append(link);out.append(card)}nav.innerHTML='';for(const c of ['All',...new Set(articles.map(a=>a.category))]){const b=document.createElement('button');b.textContent=c;b.className=c===active?'active':'';b.onclick=()=>{active=c;draw()};nav.append(b)}}
fetch('posts.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).then(posts=>{articles.push(...posts);draw()}).catch(()=>draw());
</script></body></html>
