name: Sync legacy thumbnails

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh legacy thumbnail links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const repos = [
            ['September-2026-article', 'https://sema-coms.github.io/September-2026-article/'],
            ['June-article-2026', 'https://sema-coms.github.io/June-article-2026/'],
            ['Strategic-Plan-2026-2029', 'https://sema-coms.github.io/Strategic-Plan-2026-2029/'],
            ['March2026', 'https://sema-coms.github.io/March2026/'],
            ['February', 'https://sema-coms.github.io/February/'],
            ['Feb-Article', 'https://sema-coms.github.io/Feb-Article/'],
            ['Jan-2026-article', 'https://sema-coms.github.io/Jan-2026-article/']
          ];
          async function request(path) {
            const response = await fetch(`https://api.github.com${path}`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }
            });
            if (!response.ok) throw new Error(`${path}: ${response.status}`);
            return response.json();
          }
          (async () => {
            const thumbnails = {};
            const owner = process.env.GITHUB_REPOSITORY_OWNER;
            for (const [repo, page] of repos) {
              try {
                const tree = await request(`/repos/${owner}/${repo}/git/trees/main?recursive=1`);
                const image = (tree.tree || []).find(item => item.type === 'blob' && /(^|[-_.])thumbnail[-_.]?/i.test(item.path.split('/').pop()) && /\.(png|jpe?g|webp|gif)$/i.test(item.path));
                if (image) thumbnails[page] = `https://${owner.toLowerCase()}.github.io/${repo}/${image.path.split('/').map(encodeURIComponent).join('/')}`;
              } catch (error) {
                console.warn(`Could not check ${repo}: ${error.message}`);
              }
            }
            const next = JSON.stringify(thumbnails, null, 2) + '\n';
            const file = 'legacy-thumbnails.json';
            if (!fs.existsSync(file) || fs.readFileSync(file, 'utf8') !== next) fs.writeFileSync(file, next);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Commit any thumbnail updates
        run: |
          if git diff --quiet -- legacy-thumbnails.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add legacy-thumbnails.json
          git commit -m 'Sync legacy article thumbnails'
          git push
