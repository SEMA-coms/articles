
name: Update article list

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the article list from uploaded folders
        run: |
          node <<'NODE'
          const fs = require('fs');
          const root = 'posts';
          const clean = value => String(value || '').replace(/\s+/g, ' ').trim();
          const encodePath = value => value.split('/').map(encodeURIComponent).join('/');
          const posts = [];
          const categoryFor = name => /newsletter/i.test(name) ? 'Newsletters' : /plan/i.test(name) ? 'Plans' : 'Articles';
          const findThumbnail = dir => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const path = dir + '/' + entry.name;
              if (entry.isDirectory()) {
                const found = findThumbnail(path);
                if (found) return found;
              } else if (/thumbnail\.(png|jpe?g|webp|gif)$/i.test(entry.name)) {
                return path;
              }
            }
            return '';
          };
          const scan = dir => {
            if (!fs.existsSync(dir)) return;
            const articleFile = dir + '/index.html';
            if (fs.existsSync(articleFile)) {
              const html = fs.readFileSync(articleFile, 'utf8');
              const relative = dir.replace(/^posts\//, '');
              const title = clean((html.match(/<title[^>]*>([\s\S]*?)<\/title>/i) || [])[1]) || relative.replace(/[-_]/g, ' ');
              const summary = clean((html.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']*)/i) || [])[1]) || 'SEMA article.';
              const articleImage = clean((html.match(/<img\b[^>]*\bsrc=["']([^"']+)/i) || [])[1]);
              const namedThumbnail = findThumbnail(dir);
              const image = namedThumbnail ? namedThumbnail.slice(dir.length + 1) : articleImage;
              posts.push({
                title,
                summary,
                date: new Date(fs.statSync(articleFile).mtime).toISOString().slice(0, 10),
                category: categoryFor(relative),
                url: 'posts/' + encodePath(relative) + '/',
                thumbnail: image ? (/^https?:\/\//i.test(image) ? image : 'posts/' + encodePath(relative + '/' + image.replace(/^\.\//, ''))) : ''
              });
              return;
            }
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isDirectory()) scan(dir + '/' + entry.name);
            }
          };
          scan(root);
          posts.sort((a, b) => b.date.localeCompare(a.date));
          fs.writeFileSync('posts.json', JSON.stringify(posts, null, 2) + '\n');
          NODE
      - name: Commit the updated list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts.json
          git diff --cached --quiet || git commit -m 'Update article list'
          git push
