
name: Update article list

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the published article list
        run: |
          node <<'NODE'
          const fs = require('fs');
          const root = 'posts';
          const clean = value => String(value || '').replace(/\s+/g, ' ').trim();
          const posts = [];
          const scan = dir => {
            if (!fs.existsSync(dir)) return;
            const metadataFile = dir + '/article.json';
            const articleFile = dir + '/index.html';
            if (fs.existsSync(metadataFile) && fs.existsSync(articleFile)) {
              const meta = JSON.parse(fs.readFileSync(metadataFile, 'utf8'));
              if (meta.published !== false) {
                const relative = dir.replace(/^posts\//, '');
                posts.push({
                  title: clean(meta.title) || relative,
                  summary: clean(meta.summary) || 'SEMA article.',
                  date: /^\d{4}-\d{2}-\d{2}$/.test(meta.date || '') ? meta.date : new Date(fs.statSync(articleFile).mtime).toISOString().slice(0, 10),
                  category: clean(meta.category) || 'Articles',
                  url: 'posts/' + relative.split('/').map(encodeURIComponent).join('/') + '/',
                  thumbnail: meta.thumbnail ? 'posts/' + relative.split('/').map(encodeURIComponent).join('/') + '/' + meta.thumbnail.split('/').map(encodeURIComponent).join('/') : ''
                });
              }
              return;
            }
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isDirectory()) scan(dir + '/' + entry.name);
            }
          };
          scan(root);
          posts.sort((a, b) => b.date.localeCompare(a.date));
          fs.writeFileSync('posts.json', JSON.stringify(posts, null, 2) + '\n');
          NODE
      - name: Commit the updated list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts.json
          git diff --cached --quiet || git commit -m 'Update article list'
          git push
